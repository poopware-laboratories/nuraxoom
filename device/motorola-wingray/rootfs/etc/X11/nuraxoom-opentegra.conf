# NuraXoom: Tegra 2 GR2D (EXA) acceleration through xf86-video-opentegra.
# Selected by /etc/tinydm.d/env-x11.d/90-nuraxoom-display via XORGCONFIG.
# musl binds every symbol at dlopen time, so libexa must already be loaded
# when opentegra_drv.so is (else: "exaGetPixmapDriverPrivate: symbol not found").
Section "Module"
	Load "exa"
EndSection
Section "Device"
	Identifier "Tegra"
	Driver "opentegra"
	Option "AccelMethod" "EXA"
	# Sxmo draws mostly text and small rects: per-glyph GR2D jobs are slower than
	# pixman on the CPU (each job is a host1x round trip). Keep fills/copies on
	# the GPU, composite (text, alpha) in software.
	Option "AccelCompositing" "false"
EndSection
Section "ServerFlags"
	Option "AutoAddGPU" "false"
EndSection
