# NuraXoom: Tegra 2 GR2D (EXA) acceleration through xf86-video-opentegra.
# Selected by /etc/tinydm.d/env-x11.d/90-nuraxoom-display via XORGCONFIG.
# musl binds every symbol at dlopen time, so libexa must already be loaded
# when opentegra_drv.so is (else: "exaGetPixmapDriverPrivate: symbol not found").
Section "Module"
	Load "exa"
EndSection
Section "Device"
	Identifier "Tegra"
	Driver "opentegra"
	Option "AccelMethod" "EXA"
	# Text and alpha blending on GR3D. Needs kernel patch 0010 (no CPU cache
	# sync per host1x job; before it every job cost ~10 ms and this was off).
	# Measured 2026-11-02: blending 8x and text 2x faster than modesetting.
	Option "AccelCompositing" "true"
	# Batch GR3D draws into one host1x job (opentegra patch 0002): ~14x fewer
	# jobs, tiny blended rects 2.5x and large blends 3x faster.
	Option "Merge3DJobs" "true"
EndSection
Section "ServerFlags"
	Option "AutoAddGPU" "false"
EndSection
