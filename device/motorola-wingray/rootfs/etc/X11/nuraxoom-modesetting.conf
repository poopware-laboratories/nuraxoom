# NuraXoom: safe fallback - plain KMS modesetting, as Xorg autoconfigures it.
# glamor refuses llvmpipe (no GL on Tegra 2) and falls back to CPU drawing.
# Do not force AccelMethod "none" or ShadowFB: either makes ScreenInit fail on
# the tablet (verified 2026-11-01).
Section "Device"
	Identifier "Tegra"
	Driver "modesetting"
EndSection
Section "ServerFlags"
	Option "AutoAddGPU" "false"
EndSection
