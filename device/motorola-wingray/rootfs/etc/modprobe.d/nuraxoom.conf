# BCM4329 on wingray: no wake-capable OOB line, keep firmware roaming off
options brcmfmac roamoff=1
# CPCAP ADC (battery voltage/current, temperatures): upstream reports the power
# button IRQ stops firing while it is loaded. Not autoloaded until verified;
# The battery gauge is the DS2781 on the one-wire bus (ds2781_battery).
blacklist cpcap_adc
